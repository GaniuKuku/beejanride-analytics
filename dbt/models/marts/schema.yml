version: 2

models:

  - name: dim_city
    description: "City dimension containing city attributes and market launch dates for geographical analysis."
    config:
      meta:
        owner: operations
      tags:
        - operations
    columns:
      - name: city_id
        description: "Primary key for the city."
        data_tests:
          - not_null
          - unique

      - name: city_name
        description: "Name of the city."

      - name: country
        description: "Country where the city is located."

      - name: launch_date
        description: "Date when BeejanRide launched operations in this city."

  - name: dim_driver
    description: "{{ doc('driver_lifetime_trips') }}"
    config:
      meta:
        owner: operations
      tags:
        - operations
    columns:
      - name: driver_id
        description: "Primary key identifying the driver."
        data_tests:
          - not_null
          - unique

      - name: city_id
        description: "Identifier of the city associated with the driver."

      - name: vehicle_id
        description: "Identifier of the vehicle associated with the driver."

      - name: driver_status
        description: "Current operational status of the driver."

      - name: rating
        description: "Current driver rating."

      - name: onboarding_date
        description: "Date the driver joined the platform."

      - name: driver_lifetime_trips
        description: "Total number of completed trips attributed to the driver."


  - name: dim_rider
    description: "{{ doc('rider_lifetime_value') }}"
    config:
      meta:
        owner: operations
      tags:
        - operations
        - finance
    columns:
      - name: rider_id
        description: "Primary key identifying the rider."
        data_tests:
          - not_null
          - unique

      - name: referral_code
        description: "Referral code associated with the rider."

      - name: signup_date
        description: "Date the rider registered on the platform."

      - name: rider_lifetime_value
        description: "Cumulative net revenue generated by the rider from completed trips."


  - name: dim_date
    description: "Date dimension covering 2021 through 2030 for time-series analysis, reporting, and cohort analysis."
    config:
      meta:
        owner: shared
    columns:
      - name: date_key
        description: "Integer date key in YYYYMMDD format."
        data_tests:
          - not_null
          - unique

      - name: date
        description: "Calendar date."

      - name: year
        description: "Calendar year."

      - name: quarter
        description: "Calendar quarter."

      - name: month
        description: "Calendar month number."

      - name: month_name
        description: "Calendar month name."

      - name: week_of_year
        description: "ISO week number."

      - name: day_of_month
        description: "Day number within the month."

      - name: day_of_week
        description: "BigQuery day-of-week number, where Sunday is 1 and Saturday is 7."

      - name: day_name
        description: "Name of the day of the week."

      - name: is_weekend
        description: "Whether the date falls on Saturday or Sunday."

  - name: fct_trips
    description: "Trip-level fact table containing financial, operational, payment, and fraud metrics for BeejanRide trips."
    config:
      meta:
        owner: finance
      tags:
        - finance
        - operations
        - fraud
    columns:
      - name: trip_id
        description: "Unique identifier for the trip and primary key of the fact table."
        data_tests:
          - not_null
          - unique

      - name: rider_id
        description: "Identifier of the rider associated with the trip."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_rider')
              field: rider_id

      - name: driver_id
        description: "Identifier of the driver associated with the trip."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_driver')
              field: driver_id

      - name: city_id
        description: "Identifier of the city where the trip occurred."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_city')
              field: city_id

      - name: date_key
        description: "YYYYMMDD key identifying the requested trip date."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key

      - name: vehicle_id
        description: "Identifier of the vehicle used for the trip."

      - name: trip_status
        description: "Final status of the trip."

      - name: payment_method
        description: "Payment method associated with the trip."

      - name: actual_fare_amount
        description: "Actual fare charged or calculated for the trip."

      - name: estimated_fare_amount
        description: "Estimated fare presented for the trip."

      - name: successful_payment_amount
        description: "{{ doc('gross_revenue') }}"

      - name: successful_payment_fee
        description: "Total processing fees from successful payment attempts."

      - name: net_revenue
        description: "{{ doc('net_revenue') }}"

      - name: surge_multiplier
        description: "Surge multiplier applied to the trip."

      - name: trip_duration_minutes
        description: "{{ doc('trip_duration_minutes') }}"

      - name: corporate_trip_flag
        description: "{{ doc('corporate_trip_flag') }}"

      - name: failed_payment_count
        description: "Number of failed payment attempts associated with the trip."

      - name: multiple_payment_attempts_flag
        description: "{{ doc('multiple_payment_attempts') }}"

      - name: duplicate_successful_payment_flag
        description: "{{ doc('duplicate_successful_payment') }}"

      - name: failed_payment_on_completed_trip
        description: "{{ doc('failed_payment_on_completed_trip') }}"

      - name: extreme_surge_flag
        description: "{{ doc('extreme_surge_flag') }}"

      - name: requested_at
        description: "Timestamp when the trip was requested."

      - name: picked_up_at
        description: "Timestamp when the rider was picked up."

      - name: dropped_off_at
        description: "Timestamp when the rider was dropped off."

      - name: created_at
        description: "Timestamp when the trip record was created."

      - name: updated_at
        description: "Timestamp when the trip record was last updated."
