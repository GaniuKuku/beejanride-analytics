version: 2

models:

  - name: int_payments
    description: "{{ doc('gross_revenue') }}"
    config:
      meta:
        owner: finance
      tags:
        - finance
        - fraud
    columns:

      - name: trip_id
        description: "Unique identifier of the trip associated with the payment activity."
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_trips')
              field: trip_id

      - name: payment_count
        description: "Total number of payment attempts associated with the trip."
        data_tests:
          - not_null

      - name: successful_payment_count
        description: "Number of successful payment attempts associated with the trip."
        data_tests:
          - not_null

      - name: successful_payment_amount
        description: "Total monetary amount from successful payments associated with the trip."
        data_tests:
          - not_null

      - name: successful_payment_fee
        description: "Total processing fees associated with successful payments for the trip."
        data_tests:
          - not_null

      - name: failed_payment_count
        description: "Number of failed payment attempts associated with the trip."
        data_tests:
          - not_null

      - name: multiple_payment_attempts_flag
        description: "{{ doc('multiple_payment_attempts') }}"
        data_tests:
          - not_null

      - name: duplicate_successful_payment_flag
        description: "{{ doc('duplicate_successful_payment') }}"
        data_tests:
          - not_null


  - name: int_trips
    description: "Trip-level business transformation combining staged trip data with aggregated payment information for operational, financial and fraud analytics."
    config:
      meta:
        owner: operations
      tags:
        - finance
        - operations
        - fraud
    columns:

      - name: trip_id
        description: "Unique identifier of the trip."
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_trips')
              field: trip_id

      - name: rider_id
        description: "Identifier of the rider associated with the trip."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_riders')
              field: rider_id

      - name: driver_id
        description: "Identifier of the driver associated with the trip."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_drivers')
              field: driver_id

      - name: city_id
        description: "Identifier of the city where the trip occurred."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_cities')
              field: city_id

      - name: trip_duration_minutes
        description: "{{ doc('trip_duration_minutes') }}"

      - name: corporate_trip_flag
        description: "{{ doc('corporate_trip_flag') }}"
        data_tests:
          - not_null

      - name: net_revenue
        description: "{{ doc('net_revenue') }}"
        data_tests:
          - not_null

      - name: multiple_payment_attempts_flag
        description: "{{ doc('multiple_payment_attempts') }}"
        data_tests:
          - not_null

      - name: duplicate_successful_payment_flag
        description: "{{ doc('duplicate_successful_payment') }}"
        data_tests:
          - not_null

      - name: failed_payment_on_completed_trip
        description: "{{ doc('failed_payment_on_completed_trip') }}"
        data_tests:
          - not_null

      - name: extreme_surge_flag
        description: "{{ doc('extreme_surge_flag') }}"
        data_tests:
          - not_null


  - name: int_drivers
    description: "Driver-level business transformation containing completed trip activity and driver attributes."
    config:
      meta:
        owner: operations
      tags:
        - operations
    columns:

      - name: driver_id
        description: "Unique identifier of the driver."
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_drivers')
              field: driver_id

      - name: driver_lifetime_trips
        description: "{{ doc('driver_lifetime_trips') }}"
        data_tests:
          - not_null


  - name: int_riders
    description: "Rider-level business transformation containing rider attributes and cumulative lifetime value."
    config:
      meta:
        owner: operations
      tags:
        - finance
        - operations
    columns:

      - name: rider_id
        description: "Unique identifier of the rider."
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_riders')
              field: rider_id

      - name: rider_lifetime_value
        description: "{{ doc('rider_lifetime_value') }}"
        data_tests:
          - not_null
